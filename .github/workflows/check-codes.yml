name: Check game redeem codes

on:
  schedule:
    # 毎時17分：コード確認
    - cron: "17 * * * *"

    # 毎月1日 03:41 UTC（日本時間12:41）：ハートビート
    - cron: "41 3 1 * *"

  workflow_dispatch:
    inputs:
      notify_all:
        description: "現在の全コードをDiscordへ通知する"
        required: true
        default: false
        type: boolean
      test_webhook:
        description: "Discordへ接続テストを1件送る"
        required: true
        default: false
        type: boolean

concurrency:
  group: game-code-checker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check codes and notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_ALL: ${{ inputs.notify_all }}
          TEST_WEBHOOK: ${{ inputs.test_webhook }}
        run: |
          args=()

          if [[ "$NOTIFY_ALL" == "true" ]]; then
            args+=(--notify-all)
          fi

          if [[ "$TEST_WEBHOOK" == "true" ]]; then
            args+=(--test-webhook)
          fi

          python3 check_codes.py "${args[@]}"

      - name: Monthly heartbeat
        if: github.event_name == 'schedule' && github.event.schedule == '41 3 1 * *'
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt

      - name: Save code list and heartbeat
        run: |
          git add data/seen_codes.json

          if [[ -f .github/heartbeat.txt ]]; then
            git add .github/heartbeat.txt
          fi

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update notifier state"
          git push
