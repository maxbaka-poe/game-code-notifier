name: Publish game event calendars

on:
  schedule:
    # 6時間ごとにイベントカレンダーを更新
    - cron: "23 */6 * * *"

  workflow_dispatch:

concurrency:
  group: game-event-calendars
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate calendars
        run: python3 generate_calendars.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload calendar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
