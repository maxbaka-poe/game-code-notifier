name: Publish game event calendars

on:
  schedule:
    - cron: "23 */6 * * *"
    - cron: "41 3 1 * *"
  workflow_dispatch:

concurrency:
  group: game-event-calendars
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate calendars
        run: python3 generate_calendars.py

      - name: Monthly heartbeat
        if: github.event_name == 'schedule' && github.event.schedule == '41 3 1 * *'
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .github/heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat.txt
          git commit -m "chore: monthly Actions heartbeat" || exit 0
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload calendar site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
